services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional broker for broadcast or other async modules.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    profiles: ["broker"]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      PRIMARY_DB: ${PRIMARY_DB:-postgres}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://app:app@postgres:5432/app
      BROKER_ENABLED: ${BROKER_ENABLED:-false}
      AMQP_URL: ${AMQP_URL:-amqp://guest:guest@rabbitmq:5672}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      FEATURES_ENABLED: ${FEATURES_ENABLED:-template-status}
      FEATURE_TEMPLATE_PING_ENABLED: ${FEATURE_TEMPLATE_PING_ENABLED:-true}
      FEATURE_TEMPLATE_ADMIN_STATUS_ENABLED: ${FEATURE_TEMPLATE_ADMIN_STATUS_ENABLED:-false}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
